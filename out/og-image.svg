<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0e4a5a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Decorative Accent Bar -->
  <rect x="0" y="0" width="1200" height="12" fill="url(#accent)" />
  
  <!-- Badge -->
  <rect x="80" y="70" width="480" height="44" rx="22" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
  <text x="100" y="98" fill="#fde68a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">⚡ AUTHORIZED LOAN CONNECTOR • HABSIGUDA</text>
  
  <!-- Main Title -->
  <text x="80" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">Check Your Eligibility &amp;</text>
  <text x="80" y="260" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">Find a Suitable Bank Loan</text>
  
  <!-- Subtitle -->
  <text x="80" y="325" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="24" font-weight="500">ICICI Bank &amp; Leading Financial Institutions • Doorstep Service in Hyderabad</text>
  
  <!-- Telugu Tagline -->
  <rect x="80" y="365" width="1040" height="75" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.35)" />
  <text x="110" y="412" fill="#fde68a" font-family="system-ui, sans-serif" font-size="24" font-weight="700">మీకు ఏ Bank Loan Eligibility ఉందో తెలుసుకోండి! (Call / WhatsApp: 63026 90251)</text>
  
  <!-- Trust Strip Badges -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="310" height="70" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="20" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">🏛️ Multi-Bank Options</text>
    
    <!-- Pill 2 -->
    <rect x="330" y="0" width="310" height="70" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="350" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">⚡ Express Sanction</text>
    
    <!-- Pill 3 -->
    <rect x="660" y="0" width="380" height="70" rx="14" fill="#25D366" />
    <text x="685" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800">💬 WhatsApp: +91 6302690251</text>
  </g>
  
  <!-- Bottom Notice -->
  <text x="80" y="595" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Habsiguda Loan Desk • Habsiguda, Hyderabad • Loan approval at sole discretion of the respective bank</text>
</svg>
